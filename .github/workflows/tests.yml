name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest Python that CUDA-Q 0.16 has wheels for.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install qengine with its test dependencies
        run: pip install -e ".[test]"
      # -rs lists skipped tests with the reason, so it is visible in the log
      # which Phase 1 tests are still waiting for grover.py.
      - name: Run the tests
        run: pytest -q -rs
