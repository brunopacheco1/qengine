[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qengine"
version = "0.1.0.dev0"
description = "Can a rules engine benefit from quantum computing? A CUDA-Q experiment."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.15"  # CUDA-Q 0.16 ships wheels for 3.11-3.14 only
dependencies = ["cudaq>=0.16,<0.17"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The CUDA-Q `sample` and `observe`:FutureWarning"]
